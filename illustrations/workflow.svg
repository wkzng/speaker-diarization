<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13">

  <!-- Background -->
  <rect width="900" height="1200" fill="#0f1117"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">Community-1 Diarization Pipeline</text>
  <text x="450" y="62" text-anchor="middle" fill="#64748b" font-size="12">pyannote-free inference · ONNX Runtime</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- STEP 1: INPUT -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="300" y="85" width="300" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">INPUT: WAV FILE</text>
  <text x="450" y="126" text-anchor="middle" fill="#64748b" font-size="11">mono · 16kHz · float32</text>
  <text x="450" y="142" text-anchor="middle" fill="#64748b" font-size="11">shape: (1, 1, N_samples)</text>

  <!-- Arrow down -->
  <line x1="450" y1="145" x2="450" y2="175" stroke="#475569" stroke-width="2"/>
  <polygon points="450,178 445,168 455,168" fill="#475569"/>
  <text x="470" y="163" fill="#64748b" font-size="10">torchaudio.load()</text>
  <text x="470" y="175" fill="#64748b" font-size="10">resample → 16kHz</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- STEP 2: CHUNKING -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="250" y="180" width="400" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="203" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="bold">SLIDING WINDOW CHUNKER</text>
  <text x="450" y="221" text-anchor="middle" fill="#64748b" font-size="11">10s chunks · step=segmentation_step</text>
  <text x="450" y="237" text-anchor="middle" fill="#64748b" font-size="11">output: [(1,1,160000), (1,1,160000), ...]</text>

  <!-- Arrow splits into two paths -->
  <line x1="450" y1="240" x2="450" y2="265" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="265" x2="200" y2="265" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="265" x2="700" y2="265" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="265" x2="200" y2="290" stroke="#475569" stroke-width="2"/>
  <line x1="700" y1="265" x2="700" y2="290" stroke="#475569" stroke-width="2"/>
  <polygon points="200,293 195,283 205,283" fill="#475569"/>
  <polygon points="700,293 695,283 705,283" fill="#475569"/>

  <!-- Branch labels -->
  <text x="120" y="262" fill="#64748b" font-size="10">LEFT BRANCH</text>
  <text x="710" y="262" fill="#64748b" font-size="10">RIGHT BRANCH</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- LEFT BRANCH: SEGMENTATION -->
  <!-- ═══════════════════════════════════════ -->

  <!-- SincNet box -->
  <rect x="60" y="293" width="280" height="55" rx="6" fill="#1a2035" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="313" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">① SincNet  (ONNX: segmentation.onnx)</text>
  <text x="200" y="330" text-anchor="middle" fill="#64748b" font-size="10">learnable filterbank → conv1d stack</text>
  <text x="200" y="345" text-anchor="middle" fill="#64748b" font-size="10">(1,1,160000) → (1, T, 60) features</text>

  <line x1="200" y1="348" x2="200" y2="368" stroke="#475569" stroke-width="1.5"/>
  <polygon points="200,371 195,361 205,361" fill="#475569"/>

  <!-- BiLSTM box -->
  <rect x="60" y="371" width="280" height="45" rx="6" fill="#1a2035" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="391" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">② BiLSTM × 4 layers</text>
  <text x="200" y="408" text-anchor="middle" fill="#64748b" font-size="10">(1, T, 60) → (1, T, 256) hidden states</text>

  <line x1="200" y1="416" x2="200" y2="436" stroke="#475569" stroke-width="1.5"/>
  <polygon points="200,439 195,429 205,429" fill="#475569"/>

  <!-- Classifier box -->
  <rect x="60" y="439" width="280" height="45" rx="6" fill="#1a2035" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="459" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">③ Linear → LogSoftmax</text>
  <text x="200" y="476" text-anchor="middle" fill="#64748b" font-size="10">(1, T, 256) → (1, 589, 7) per-frame scores</text>

  <!-- Segmentation output label -->
  <rect x="60" y="500" width="280" height="40" rx="6" fill="#292524" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="518" text-anchor="middle" fill="#fcd34d" font-size="11">SEGMENTATION OUTPUT</text>
  <text x="200" y="533" text-anchor="middle" fill="#64748b" font-size="10">589 frames × 7 local speaker scores</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- RIGHT BRANCH: EMBEDDING -->
  <!-- ═══════════════════════════════════════ -->

  <!-- fbank box -->
  <rect x="560" y="293" width="280" height="55" rx="6" fill="#1a2035" stroke="#10b981" stroke-width="1.5"/>
  <text x="700" y="313" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">① compute_fbank()  (torchaudio)</text>
  <text x="700" y="330" text-anchor="middle" fill="#64748b" font-size="10">mel filterbank · 80 bins · 25ms window</text>
  <text x="700" y="345" text-anchor="middle" fill="#64748b" font-size="10">(1,1,160000) → (1, F, 80) fbank</text>

  <line x1="700" y1="348" x2="700" y2="368" stroke="#475569" stroke-width="1.5"/>
  <polygon points="700,371 695,361 705,361" fill="#475569"/>

  <!-- ResNet box -->
  <rect x="560" y="371" width="280" height="55" rx="6" fill="#1a2035" stroke="#10b981" stroke-width="1.5"/>
  <text x="700" y="391" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">② WeSpeakerResNet34  (ONNX: embedding.onnx)</text>
  <text x="700" y="408" text-anchor="middle" fill="#64748b" font-size="10">Conv2d stack → TSTP pooling</text>
  <text x="700" y="423" text-anchor="middle" fill="#64748b" font-size="10">(1, F, 80) → (1, 256) embedding</text>

  <!-- Embedding output label -->
  <rect x="560" y="442" width="280" height="40" rx="6" fill="#1a2f27" stroke="#10b981" stroke-width="1"/>
  <text x="700" y="460" text-anchor="middle" fill="#6ee7b7" font-size="11">EMBEDDING OUTPUT</text>
  <text x="700" y="475" text-anchor="middle" fill="#64748b" font-size="10">one 256-d vector per speech segment</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- MERGE BOTH BRANCHES -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="200" y1="540" x2="200" y2="590" stroke="#475569" stroke-width="2"/>
  <line x1="700" y1="482" x2="700" y2="590" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="590" x2="700" y2="590" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="590" x2="450" y2="615" stroke="#475569" stroke-width="2"/>
  <polygon points="450,618 445,608 455,608" fill="#475569"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- STEP 3: CLUSTERING -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="250" y="618" width="400" height="65" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="450" y="640" text-anchor="middle" fill="#f9a8d4" font-size="12" font-weight="bold">CLUSTERING  (sklearn · pure Python)</text>
  <text x="450" y="658" text-anchor="middle" fill="#64748b" font-size="10">AgglomerativeClustering or K-Means on 256-d embeddings</text>
  <text x="450" y="673" text-anchor="middle" fill="#64748b" font-size="10">segments from left branch · vectors from right branch</text>

  <line x1="450" y1="683" x2="450" y2="710" stroke="#475569" stroke-width="2"/>
  <polygon points="450,713 445,703 455,703" fill="#475569"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- STEP 4: LABEL ASSIGNMENT -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="250" y="713" width="400" height="55" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="735" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">GLOBAL SPEAKER LABEL ASSIGNMENT</text>
  <text x="450" y="752" text-anchor="middle" fill="#64748b" font-size="10">merge overlapping chunks · resolve local→global IDs</text>
  <text x="450" y="767" text-anchor="middle" fill="#64748b" font-size="10">handle overlap with majority vote</text>

  <line x1="450" y1="768" x2="450" y2="795" stroke="#475569" stroke-width="2"/>
  <polygon points="450,798 445,788 455,788" fill="#475569"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- OUTPUT -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="200" y="798" width="500" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="820" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">OUTPUT: SPEAKER CHRONOGRAM</text>
  <text x="450" y="840" text-anchor="middle" fill="#94a3b8" font-size="11">[ {speaker: "speaker_0", start: 0.0,  end: 4.2},</text>
  <text x="450" y="856" text-anchor="middle" fill="#94a3b8" font-size="11">  {speaker: "speaker_1", start: 4.5,  end: 9.1},  ...]</text>
  <text x="450" y="872" text-anchor="middle" fill="#64748b" font-size="10">JSON · RTTM · or structured dataclass</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="60" y="910" width="780" height="110" rx="8" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="450" y="932" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">RUNTIME DEPENDENCIES</text>

  <rect x="80" y="945" width="12" height="12" fill="#f59e0b" rx="2"/>
  <text x="100" y="956" fill="#94a3b8" font-size="11">segmentation.onnx — PyanNet (SincNet + BiLSTM)</text>

  <rect x="80" y="968" width="12" height="12" fill="#10b981" rx="2"/>
  <text x="100" y="979" fill="#94a3b8" font-size="11">embedding.onnx — WeSpeakerResNet34 (fbank done via torchaudio, pyannote-free)</text>

  <rect x="80" y="991" width="12" height="12" fill="#ec4899" rx="2"/>
  <text x="100" y="1002" fill="#94a3b8" font-size="11">sklearn — clustering only, no neural model</text>

  <rect x="440" y="945" width="12" height="12" fill="#6366f1" rx="2"/>
  <text x="460" y="956" fill="#94a3b8" font-size="11">torchaudio — audio I/O + fbank feature extraction</text>

  <rect x="440" y="968" width="12" height="12" fill="#3b82f6" rx="2"/>
  <text x="460" y="979" fill="#94a3b8" font-size="11">onnxruntime — inference engine (no PyTorch at runtime)</text>

  <text x="450" y="1010" text-anchor="middle" fill="#475569" font-size="10">⚠  pyannote used ONLY in export_models.py — zero runtime dependency</text>

</svg>
